<!DOCTYPE html>
<html>
<head>
  <title>Screen Stream</title>
  <style>
    body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; }
    img { max-width: 100%; max-height: 100%; border: 2px solid white; }
  </style>
</head>
<body>
  <img id="screen" src="" alt="Waiting for stream..." />
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <script>
    const ws = new WebSocket(`wss://${location.host}/ws`);
  const img = document.getElementById('screen');
  ws.binaryType = 'arraybuffer';

  let latestBlobURL = null;

  ws.onmessage = (event) => {
    try {
      const compressed = new Uint8Array(event.data);
      const decompressed = pako.inflate(compressed);
      const blob = new Blob([decompressed], { type: 'image/webp' });
      const url = URL.createObjectURL(blob);

      // Revoke previous image URL to free memory
      if (latestBlobURL) {
        URL.revokeObjectURL(latestBlobURL);
      }
      latestBlobURL = url;

      img.src = url;
    } catch (err) {
      console.error('Error decoding frame:', err);
    }
  };
  </script>
</body>
</html>
